<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Web Terminal</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css">
    <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm-addon-webgl@0.15.0/lib/xterm-addon-webgl.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm-addon-unicode11@0.6.0/lib/xterm-addon-unicode11.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm-addon-web-links@0.9.0/lib/xterm-addon-web-links.js"></script>
    <style>
        :root {
            color-scheme: dark;
            --terminal-font-family: "Courier New", monospace;
            --xterm-font-size: 14px;
        }

        html,
        body {
            height: 100%;
        }

        body {
            margin: 0;
            background: #000;
            font-family: var(--terminal-font-family, "Courier New", monospace);
            display: flex;
            align-items: stretch;
            justify-content: stretch;
            touch-action: manipulation;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -khtml-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        #terminal-wrapper {
            position: relative;
            flex: 1;
            display: flex;
        }

        #terminal-container {
            flex: 1;
            display: flex;
        }

        #status-overlay {
            pointer-events: none;
            position: absolute;
            top: 1.5rem;
            left: 0;
            right: 0;
            display: none;
            justify-content: center;
            z-index: 10;
        }

        #status-overlay span {
            padding: 0.6rem 1rem;
            border-radius: 0.75rem;
            border: 1px solid rgba(255, 255, 255, 0.16);
            background: rgba(18, 18, 18, 0.9);
            color: #e5e5e5;
            font-size: 0.95rem;
            letter-spacing: 0.02em;
        }

        #status-overlay[data-tone="error"] span {
            color: #fca5a5;
            border-color: rgba(252, 165, 165, 0.5);
        }

        #status-overlay[data-tone="warn"] span {
            color: #fde68a;
            border-color: rgba(253, 230, 138, 0.5);
        }

        .xterm {
            font-family: var(--terminal-font-family, "Courier New", monospace);
            font-size: var(--xterm-font-size, 14px);
        }
    </style>
</head>
<body>
    <div id="terminal-wrapper">
        <div id="terminal-container" role="presentation"></div>
        <div id="status-overlay"><span id="status-text"></span></div>
    </div>

    <script>
        (function () {
            'use strict';

            const statusOverlay = document.getElementById('status-overlay');
            const statusText = document.getElementById('status-text');
            const terminalContainer = document.getElementById('terminal-container');

            let terminal = null;
            let fitAddon = null;
            let webglAddon = null;
            let unicode11Addon = null;
            let webLinksAddon = null;
            let ws = null;
            let reconnectTimer = null;
            let latestConfig = null;

            const urlParams = new URLSearchParams(window.location.search);
            const sessionId = urlParams.get('session');

            function showStatus(message, tone = 'info') {
                if (!message) {
                    statusOverlay.style.display = 'none';
                    statusOverlay.dataset.tone = '';
                    statusText.textContent = '';
                    return;
                }

                statusOverlay.style.display = 'flex';
                statusOverlay.dataset.tone = tone;
                statusText.textContent = message;
            }

            function writeSystemMessage(message, colorCode = 90) {
                if (!terminal) return;
                terminal.writeln(`\u001b[${colorCode}m${message}\u001b[0m`);
            }

            function createWsUrl() {
                const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
                return `${protocol}//${window.location.host}/ws?session=${encodeURIComponent(sessionId)}`;
            }

            function sendResize() {
                if (!ws || ws.readyState !== WebSocket.OPEN || !terminal) return;

                ws.send(JSON.stringify({
                    type: 'system.resize',
                    to: 'desktop',
                    data: { cols: terminal.cols, rows: terminal.rows }
                }));
            }

            function applyConfig(config) {
                if (!config) return;

                latestConfig = {
                    ...(latestConfig || {}),
                    ...config,
                    themeColors: {
                        ...(((latestConfig || {}).themeColors) || {}),
                        ...((config.themeColors || {}))
                    }
                };

                const merged = latestConfig;
                const hasTerminal = !!terminal;

                if (merged.themeColors && typeof merged.themeColors === 'object') {
                    const { background, foreground, cursor } = merged.themeColors;

                    if (background) {
                        document.body.style.backgroundColor = background;
                    }
                    if (foreground) {
                        document.body.style.color = foreground;
                    }

                    if (hasTerminal) {
                        // xterm.js 不再支持 getOption，直接设置新主题
                        terminal.options.theme = {
                            ...merged.themeColors
                        };
                    }
                }

                if (merged.fontFamily) {
                    document.documentElement.style.setProperty('--terminal-font-family', merged.fontFamily);
                    if (hasTerminal) {
                        terminal.options.fontFamily = merged.fontFamily;
                    }
                }

                if (typeof merged.fontSize === 'number' && Number.isFinite(merged.fontSize) && merged.fontSize > 0) {
                    document.documentElement.style.setProperty('--xterm-font-size', `${merged.fontSize}px`);
                    if (hasTerminal) {
                        terminal.options.fontSize = merged.fontSize;
                    }
                }

                if (typeof merged.cursorBlink === 'boolean' && hasTerminal) {
                    terminal.options.cursorBlink = merged.cursorBlink;
                }

                if (typeof merged.lineHeight === 'number' && Number.isFinite(merged.lineHeight) && merged.lineHeight > 0 && hasTerminal) {
                    terminal.options.lineHeight = merged.lineHeight;
                }

                if (typeof merged.opacity === 'number' && Number.isFinite(merged.opacity)) {
                    const clamped = Math.min(1, Math.max(0.1, merged.opacity));
                    terminalContainer.style.opacity = clamped;
                }

                if (hasTerminal && fitAddon) {
                    // 等待选项更新后再调整尺寸
                    setTimeout(() => {
                        try {
                            fitAddon.fit();
                            sendResize();  // 通知后端新的尺寸
                        } catch (error) {
                            console.warn('终端自适应失败:', error);
                        }
                    }, 100);
                }
            }

            function initTerminal() {
                terminal = new Terminal({
                    cursorBlink: true,
                    theme: {
                        background: '#000000',
                        foreground: '#ffffff',
                        cursor: '#ffffff'
                    },
                    fontSize: 14,
                    fontFamily: 'Courier New, monospace',
                    allowProposedApi: true  // 启用 proposed API 以支持 Unicode11
                });

                fitAddon = new FitAddon.FitAddon();
                terminal.loadAddon(fitAddon);

                if (window.WebglAddon && typeof WebglAddon.WebglAddon === 'function') {
                    try {
                        webglAddon = new WebglAddon.WebglAddon();
                        terminal.loadAddon(webglAddon);
                    } catch (error) {
                        console.warn('WebGL 插件初始化失败，使用 Canvas 渲染。', error);
                    }
                }

                // 加载 Unicode11 插件以支持更好的 Unicode 字符显示（包括 emoji）
                if (window.Unicode11Addon && typeof Unicode11Addon.Unicode11Addon === 'function') {
                    try {
                        unicode11Addon = new Unicode11Addon.Unicode11Addon();
                        terminal.loadAddon(unicode11Addon);
                        terminal.unicode.activeVersion = '11';
                        console.log('Unicode11 插件已加载');
                    } catch (error) {
                        console.warn('Unicode11 插件初始化失败:', error);
                    }
                }

                // 加载 WebLinks 插件以自动识别并使 URL 可点击
                if (window.WebLinksAddon && typeof WebLinksAddon.WebLinksAddon === 'function') {
                    try {
                        webLinksAddon = new WebLinksAddon.WebLinksAddon();
                        terminal.loadAddon(webLinksAddon);
                        console.log('WebLinks 插件已加载');
                    } catch (error) {
                        console.warn('WebLinks 插件初始化失败:', error);
                    }
                }

                terminal.open(terminalContainer);
                fitAddon.fit();
                terminal.focus();

                if (latestConfig) {
                    applyConfig(latestConfig);
                }

                terminal.onData((data) => {
                    if (ws && ws.readyState === WebSocket.OPEN) {
                        ws.send(JSON.stringify({
                            type: 'data.input',
                            to: 'desktop',
                            data: { input: data }
                        }));
                    }
                });
            }

            function scheduleReconnect() {
                if (reconnectTimer) return;

                reconnectTimer = setTimeout(() => {
                    reconnectTimer = null;
                    connect();
                }, 3000);
            }

            function connect() {
                if (!sessionId || sessionId === 'default') {
                    showStatus('无效的访问链接，请通过桌面应用程序生成的链接访问。', 'error');
                    return;
                }

                if (!terminal) {
                    initTerminal();
                }

                const wsUrl = createWsUrl();

                showStatus('连接中...');
                writeSystemMessage(`[web] connecting to ${wsUrl}`, 90);

                ws = new WebSocket(wsUrl);

                ws.addEventListener('open', () => {
                    showStatus('已连接，等待桌面端...');
                    writeSystemMessage('[web] connected', 92);

                    ws.send(JSON.stringify({
                        type: 'connection.devices',
                        to: 'all',
                        data: { deviceType: 'web', status: 'connected' }
                    }));
                });

                ws.addEventListener('message', (event) => {
                    try {
                        const message = JSON.parse(event.data);

                        switch (message.type) {
                            case 'data.output':
                                if (message.data && message.data.output) {
                                    terminal.write(message.data.output);
                                }
                                break;

                            case 'system.init':
                                if (message.data && message.data.cols && message.data.rows) {
                                    terminal.resize(message.data.cols, message.data.rows);
                                    fitAddon.fit();
                                }
                                break;

                            case 'connection.devices':
                                if (message.data && message.data.devices) {
                                    const desktopConnected = message.data.devices.desktop === 'connected';

                                    if (desktopConnected) {
                                        showStatus('');
                                        writeSystemMessage('[desktop] connected', 92);
                                        sendResize();
                                    } else {
                                        showStatus('等待桌面端连接...', 'warn');
                                        writeSystemMessage('[desktop] disconnected', 91);
                                    }
                                }
                                break;

                            case 'system.config':
                                applyConfig(message.data || {});
                                break;

                            default:
                                break;
                        }
                    } catch (error) {
                        console.error('处理消息失败:', error);
                    }
                });

                ws.addEventListener('close', () => {
                    showStatus('连接已断开，3秒后重连...', 'warn');
                    writeSystemMessage('[web] connection closed, retrying...', 93);
                    scheduleReconnect();
                });

                ws.addEventListener('error', (error) => {
                    console.error('WebSocket 错误:', error);
                    showStatus('连接错误', 'error');
                });
            }

            window.addEventListener('resize', () => {
                if (fitAddon) {
                    fitAddon.fit();
                    sendResize();
                }
            });

            window.addEventListener('beforeunload', () => {
                if (ws) {
                    ws.close();
                }
            });

            connect();
        })();
    </script>
</body>
</html>
